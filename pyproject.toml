[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybergem"
version = "0.1.0"
description = "A safety-conscious multi-agent CTF research and vulnerability analysis framework."
authors = [
    {name = "CTF-Agent contributors"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "docker>=7.1.0",
    "datasets>=2.19.0",
    "openai>=1.35.0",
    "anthropic>=0.34.0",
    "asyncio>=3.4.3",
    "aiofiles>=24.1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black>=24.8.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
]

[project.scripts]
cybergem = "cli.cybergem:app"

[project.urls]
Repository = "https://github.com/lseaotter/CTF-Agent"
Issues = "https://github.com/lseaotter/CTF-Agent/issues"

[tool.setuptools.packages.find]
include = ["app*", "cli*"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
